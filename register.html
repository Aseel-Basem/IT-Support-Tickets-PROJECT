<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — YIC IT Support</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="page-wrapper">

  <header>
    <nav class="navbar container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon">IT</div>
        <div>YIC IT Support<span>Yanbu Industrial College</span></div>
      </a>
      <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
        <li><a href="submit_ticket.html"><i class="fa fa-ticket-alt"></i> Submit Ticket</a></li>
        <li><a href="my_tickets.html"><i class="fa fa-list"></i> My Tickets</a></li>
        <li><a href="login.html"><i class="fa fa-sign-in-alt"></i> Login</a></li>
        <li><a href="register.html" class="btn-nav active"><i class="fa fa-user-plus"></i> Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-big">IT</div>
          <h2>Create Account</h2>
          <p class="auth-subtitle">Register to access the IT Support Portal</p>
        </div>

        <form id="register-form" novalidate>

          <div class="form-group">
            <label for="full_name">Full Name <span class="required">*</span></label>
            <input type="text" id="full_name" name="full_name" class="form-control"
                   placeholder="e.g. Aseel Basem Alharbi" autocomplete="name" />
            <div class="form-error" id="full_name-error"></div>
          </div>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-control"
                   placeholder="your.id@yic.edu.sa" autocomplete="email" />
            <div class="form-error" id="email-error"></div>
          </div>

          <div class="form-group">
            <label for="student_id">Student / Staff ID <span class="required">*</span></label>
            <input type="text" id="student_id" name="student_id" class="form-control"
                   placeholder="e.g. 441500146" maxlength="20" />
            <div class="form-error" id="student_id-error"></div>
          </div>

          <div class="form-group">
            <label for="role">Role <span class="required">*</span></label>
            <select id="role" name="role" class="form-control">
              <option value="">-- Select Role --</option>
              <option value="student">Student</option>
              <option value="staff">Staff</option>
            </select>
            <div class="form-error" id="role-error"></div>
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Minimum 8 characters" autocomplete="new-password" />
            <div class="password-strength">
              <div class="password-strength-bar" id="password-strength-bar"></div>
            </div>
            <div class="form-hint">
              Strength: <span id="password-strength-label" style="font-weight:600;"></span>
            </div>
            <div class="form-error" id="password-error"></div>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                   placeholder="Re-enter your password" autocomplete="new-password" />
            <div class="form-error" id="confirm_password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:6px;">
            <i class="fa fa-user-plus"></i> Create Account
          </button>
        </form>

        <p class="auth-link">Already have an account? <a href="login.html">Sign In</a></p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 <strong>YIC IT Support Portal</strong> — CS381 Web Application Development</p>
    </div>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
